<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E4 · A full color palette from one variable</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/demo-frame.css">
  <link rel="stylesheet" href="after.css" data-styles="before.css after.css state-teal.css state-orange.css" data-labels="Before|After|--brand: teal|--brand: orange">
  <script src="../../shared/demo-toolbar.js" defer></script>
</head>
<body>
  <a class="demo-back" href="../../index.html">← All episodes</a>
  <main class="page">
    <h1>One variable, whole palette</h1>
    <p class="lead">Every color below comes from <code class="brand-value">--brand</code></p>

    <section class="roles" aria-label="Palette roles">
      <div class="swatch pale"><span>--pale</span></div>
      <div class="swatch brand"><span>--brand</span></div>
      <div class="swatch deep"><span>--deep</span></div>
      <div class="swatch soft"><span>--soft</span></div>
      <div class="swatch alt"><span>--alt</span></div>
    </section>

    <div class="split">
      <section class="ladder" aria-label="Lightness ladder">
        <span>95</span><span>85</span><span>75</span><span>65</span><span>55</span><span>45</span><span>35</span><span>25</span>
      </section>

      <article class="notice">
        <h2>Your trial ends in 3 days</h2>
        <p>Upgrade now and keep every project, chart and teammate.</p>
        <div class="actions">
          <a class="btn" href="#">Upgrade</a>
          <a class="btn btn-alt" href="#">Compare plans</a>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
