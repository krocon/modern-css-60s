<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C6 · Same cover effect, but as a real image</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/demo-frame.css">
  <link rel="stylesheet" href="after.css" data-styles="before.css state-ratio.css after.css state-position.css" data-labels="Before|aspect-ratio only|After|object-position">
  <script src="../../shared/demo-toolbar.js" defer></script>
</head>
<body>
  <a class="demo-back" href="../../index.html">← All episodes</a>
  <main class="page">
    <h1>Weekend recipes</h1>
    <p class="lead">Four photos, four different shapes – one tidy grid.</p>
    <section class="cards" aria-label="Recipes">
      <article class="card">
        <img src="pizza.svg" alt="Pepperoni pizza with basil, seen from above" width="800" height="800">
        <h2>Pizza Margherita</h2>
        <p>1:1 photo · 35 min</p>
      </article>
      <article class="card">
        <img src="sunset.svg" alt="Sunset over the sea" width="1200" height="500" loading="lazy">
        <h2>Beach barbecue</h2>
        <p>12:5 photo · 60 min</p>
      </article>
      <article class="card">
        <img src="latte.svg" alt="Latte with heart-shaped foam art, seen from above" width="600" height="900" loading="lazy">
        <h2>Perfect flat white</h2>
        <p>2:3 photo · 5 min</p>
      </article>
      <article class="card">
        <img src="donut.svg" alt="Pink glazed donut with sprinkles" width="500" height="800" loading="lazy">
        <h2>Baked donuts</h2>
        <p>5:8 photo · 40 min</p>
      </article>
    </section>
  </main>
</body>
</html>
