  <title>Offline · Pocket Notes</title>
  <!-- Offline-Seite: kommt aus dem Cache des Service Workers. Deshalb alles inline – ohne Netz lädt keine weitere Datei. -->
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; min-block-size: 100dvh; display: grid; place-content: center; gap: 1rem; padding: 2rem; text-align: center;
           background: light-dark(#fdf4ff, #1a0420); color: light-dark(#0f172a, #f8fafc); }
    svg { inline-size: 5rem; margin-inline: auto; }
    h1 { margin: 0; font-size: 1.75rem; }
    p { margin: 0; max-inline-size: 22rem; line-height: 1.5; opacity: 0.8; }
    a { justify-self: center; padding: 0.7rem 1.4rem; border-radius: 999px; background: #a21caf; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#a21caf"/><path d="M14 38a10 10 0 0 1 4-19 14 14 0 0 1 27 3 8 8 0 0 1 3 16z" fill="#fff"/><path d="M16 50 50 14" stroke="#fdf4ff" stroke-width="6" stroke-linecap="round"/><path d="M16 50 50 14" stroke="#a21caf" stroke-width="2.5" stroke-linecap="round"/></svg>
  <h1>You’re offline</h1>
  <p>Pocket Notes needs a connection to sync. Your notes are safe – we’ll be back as soon as you are.</p>

</html>
