<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E7 · A light/dark/system switch with almost no JS</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="../../shared/demo-frame.css">
  <link rel="stylesheet" href="after.css" data-styles="before.css after.css state-light.css state-dark.css" data-labels="Before|After (System)|After (Light)|After (Dark)">
  <script src="../../shared/demo-toolbar.js" defer></script>
</head>
<body>
  <a class="demo-back" href="../../index.html">← All episodes</a>
  <main class="page">
    <h1>Settings</h1>
    <p class="lead">Pick a theme – CSS does the switching, JavaScript only remembers.</p>

    <fieldset class="theme-switch">
      <legend>Appearance</legend>
      <label><input type="radio" name="theme" id="theme-light"> ☀ Light</label>
      <label><input type="radio" name="theme" id="theme-dark"> ☾ Dark</label>
      <label><input type="radio" name="theme" id="theme-system" checked> <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg> System</label>
    </fieldset>

    <form class="card" onsubmit="return false">
      <h2>Profile</h2>
      <label>Display name <input type="text" value="Grace Hopper"></label>
      <label>Language
        <select><option selected>English</option><option>Deutsch</option></select>
      </label>
      <label class="check"><input type="checkbox" checked> Weekly summary by email</label>
      <button>Save changes</button>
    </form>
  </main>

  <script>
    // Die 3 Zeilen JS aus der Folge: Auswahl merken
    const saved = localStorage.getItem('theme');
    if (saved) document.getElementById(saved).checked = true;
    addEventListener('change', e => e.target.name === 'theme' && localStorage.setItem('theme', e.target.id));
  </script>
  <script>
    // Nur für Aufnahme/Video-Bühne: ?css=… hakt den passenden Radio-Button an (statt einer echten Mausaktion).
    const demoPick = { 'after.css': 'theme-system', 'state-light.css': 'theme-light', 'state-dark.css': 'theme-dark', 'before.css': 'theme-dark' }[new URLSearchParams(location.search).get('css')];
    if (demoPick) document.getElementById(demoPick).checked = true;
  </script>
</body>
</html>
